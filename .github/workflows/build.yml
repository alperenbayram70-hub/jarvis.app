name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle wrapper oluştur
        run: gradle wrapper --gradle-version 8.7

      - name: Gradle'a çalıştırma izni ver
        run: chmod +x gradlew

      - name: Debug APK derle
        run: ./gradlew assembleDebug -PGEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
